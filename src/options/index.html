<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blasito · Tus atajos</title>
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body class="options-page">
    <header class="topbar">
      <div class="topbar-inner">
        <div class="topbar-copy">
          <span class="wordmark">Blasito</span>
          <p>Escribí un atajo en cualquier campo de texto y Blasito lo reemplaza por el texto guardado.</p>
        </div>
        <div class="topbar-actions">
          <label class="file-input">
            <input id="import-input" type="file" accept="application/json,.json" />
            <span class="button">Importar</span>
          </label>
          <button id="export-button" class="button" type="button">Exportar</button>
        </div>
      </div>
    </header>

    <main class="options-layout">
      <section class="panel list-panel" aria-labelledby="list-title">
        <div class="panel-heading">
          <h1 id="list-title">Tus atajos <span id="snippet-count" class="count">0</span></h1>
          <button id="new-button" class="button primary" type="button">Nuevo atajo</button>
        </div>
        <label class="search-field">
          <span class="sr-only">Buscar atajos</span>
          <input id="search" type="search" placeholder="Buscar atajos" />
        </label>
        <p id="list-status" class="status" role="status" aria-live="polite"></p>
        <div id="list-toolbar" class="list-toolbar">
          <label class="select-all-field">
            <input id="select-all" type="checkbox" />
            Seleccionar todos
          </label>
          <button id="delete-selected-button" class="button small danger" type="button" hidden>Eliminar seleccionados</button>
        </div>
        <ul id="snippet-list" class="snippet-list" aria-labelledby="list-title"></ul>
        <div id="empty-state" class="empty-state">
          <strong>Todavía no guardaste atajos</strong>
          <span>Tocá «Nuevo atajo» para crear el primero.</span>
        </div>
      </section>

      <section id="editor" class="panel editor-panel" aria-labelledby="editor-title">
        <h2 id="editor-title">Nuevo atajo</h2>
        <form id="snippet-form">
          <label>Atajo <span class="hint">Lo que vas a escribir, por ejemplo /hola</span><input id="shortcut" class="mono-input" name="shortcut" autocomplete="off" spellcheck="false" required /></label>
          <label>Texto guardado <span class="hint">Lo que aparece en lugar del atajo</span><textarea id="content" name="content" rows="5" required></textarea></label>
          <label>Nombre <span class="hint">Opcional, para encontrarlo después</span><input id="name" name="name" autocomplete="off" /></label>
          <p id="form-status" class="status" role="status" aria-live="polite"></p>
          <div class="form-actions">
            <button id="save-button" class="button primary" type="submit">Guardar atajo</button>
            <button id="cancel-button" class="button" type="button" hidden>Cancelar</button>
            <button id="delete-button" class="button danger" type="button" hidden>Eliminar</button>
          </div>
        </form>
      </section>
    </main>
    <script type="module" src="./index.ts"></script>
  </body>
</html>
