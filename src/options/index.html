<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blasito · Tus atajos</title>
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body>
    <header class="topbar">
      <strong>Blasito</strong>
    </header>

    <main class="options-layout">
      <section class="panel editor-panel" aria-labelledby="editor-title">
        <div class="section-heading">
          <h1 id="editor-title">Nuevo atajo</h1>
        </div>
        <form id="snippet-form">
          <label>Nombre <span class="optional">Para reconocerlo; es opcional</span><input id="name" name="name" autocomplete="off" placeholder="Respuesta de bienvenida" /></label>
          <label>Atajo <span class="optional">Lo que vas a escribir</span><input id="shortcut" name="shortcut" autocomplete="off" placeholder="/hola" required /></label>
          <label>Texto guardado <span class="optional">Lo que Blasito va a insertar</span><textarea id="content" name="content" rows="9" placeholder="Hola, ¿cómo estás?" required></textarea></label>
          <p id="form-status" class="status" role="status" aria-live="polite"></p>
          <div class="form-actions">
            <button class="button primary" type="submit"><span id="submit-label">Guardar atajo</span></button>
            <button id="cancel-edit" class="button secondary" type="button" hidden>Cancelar</button>
          </div>
        </form>

        <section class="import-panel" aria-labelledby="import-title">
          <h2 id="import-title">Importar varios atajos</h2>
          <p>Elegí un archivo JSON con una lista de atajos. Los repetidos se saltean.</p>
          <label class="file-input">
            <span>Archivo JSON</span>
            <input id="import-file" type="file" accept="application/json,.json" />
            <span class="button secondary">Elegir archivo</span>
          </label>
          <p id="import-status" class="status" role="status" aria-live="polite"></p>
        </section>
      </section>

      <section class="panel list-panel" aria-labelledby="list-title">
        <div class="section-heading list-heading">
          <h2 id="list-title">Tus atajos</h2>
          <span id="snippet-count" class="count">0</span>
        </div>
        <label class="search-field"><span class="sr-only">Buscar atajos</span><input id="search" type="search" placeholder="Buscar por nombre, atajo o texto" /></label>
        <p id="list-status" class="status" role="status" aria-live="polite"></p>
        <ul id="snippet-list" class="snippet-list"></ul>
        <div id="empty-state" class="empty-state">
          <strong>Todavía no guardaste atajos</strong><span>Creá el primero con el formulario.</span>
        </div>
      </section>
    </main>
    <script type="module" src="./index.ts"></script>
  </body>
</html>
