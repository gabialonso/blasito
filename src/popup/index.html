<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blasito</title>
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body class="popup">
    <header class="popup-header">
      <strong>Blasito</strong>
    </header>
    <main class="popup-main">
      <label class="search-field"><span class="sr-only">Buscar atajos</span><input id="search" type="search" placeholder="Buscar por nombre o atajo" /></label>
      <p id="popup-status" class="status" role="status" aria-live="polite"></p>
      <ul id="snippet-list" class="snippet-list popup-list"></ul>
      <div id="empty-state" class="empty-state"><strong>Todavía no guardaste atajos</strong><span>Creá uno para insertar tus textos más rápido.</span></div>
    </main>
    <footer class="popup-footer"><button id="open-options" class="button primary" type="button">Crear o editar atajos</button></footer>
    <script type="module" src="./index.ts"></script>
  </body>
</html>
