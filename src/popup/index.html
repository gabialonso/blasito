<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blasito</title>
    <link rel="icon" href="/icons/icon-32.png" />
    <link rel="stylesheet" href="../shared/styles.css" />
  </head>
  <body class="popup">
    <header class="topbar">
      <div class="topbar-inner"><span class="wordmark"><img class="logo" src="../shared/logo.svg" alt="" width="1034" height="876" />Blasito</span></div>
    </header>
    <main class="popup-main">
      <label class="search-field">
        <span class="sr-only">Buscar atajos</span>
        <input id="search" type="search" placeholder="Buscar atajos" autofocus />
      </label>
      <p id="popup-hint" class="hint">Elegí un atajo para copiar su texto, o apretá Enter para copiar el primero.</p>
      <p id="popup-status" class="status" role="status" aria-live="polite"></p>
      <ul id="snippet-list" class="snippet-list popup-list" aria-label="Atajos" aria-describedby="popup-hint"></ul>
      <div id="empty-state" class="empty-state">
        <strong>Todavía no guardaste atajos</strong>
        <span>Creá uno para insertar tus textos más rápido.</span>
      </div>
    </main>
    <footer class="popup-footer">
      <button id="open-options" class="button primary" type="button">Administrar atajos</button>
    </footer>
    <script type="module" src="./index.ts"></script>
  </body>
</html>
